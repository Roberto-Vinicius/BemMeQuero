<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="800"
     viewBox="200 200 400 400"
     role="img">

  <title>Flor Bem Me Quero Perfumaria</title>

  <defs>
    <!-- Gradiente do centro dourado -->
    <radialGradient id="gold" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#D9B84E"/>
      <stop offset="1" stop-color="#B98F32"/>
    </radialGradient>

    <!-- Formato das pétalas externas -->
    <path id="petal"
      d="M 0,-42
         C -23,-76 -28,-133 -10,-178
         C -5,-191 5,-191 10,-178
         C 28,-133 23,-76 0,-42 Z"/>

    <!-- Formato das pétalas internas -->
    <path id="petalInner"
      d="M 0,-35
         C -20,-65 -25,-112 -9,-151
         C -4,-162 4,-162 9,-151
         C 25,-112 20,-65 0,-35 Z"/>
  </defs>

  <g transform="translate(400 400)">

    <!-- CAMADA EXTERNA -->
    <g fill="#D9908F"
       stroke="#D48E8C"
       stroke-width="1.4">

      <use href="#petal" transform="rotate(0)"/>
      <use href="#petal" transform="rotate(20)" fill="#E6A4A0"/>
      <use href="#petal" transform="rotate(40)" fill="#E9AAA5"/>
      <use href="#petal" transform="rotate(60)"/>
      <use href="#petal" transform="rotate(80)" fill="#E6A4A0"/>
      <use href="#petal" transform="rotate(100)" fill="#E9AAA5"/>
      <use href="#petal" transform="rotate(120)"/>
      <use href="#petal" transform="rotate(140)" fill="#E6A4A0"/>
      <use href="#petal" transform="rotate(160)" fill="#E9AAA5"/>
      <use href="#petal" transform="rotate(180)"/>
      <use href="#petal" transform="rotate(200)" fill="#E6A4A0"/>
      <use href="#petal" transform="rotate(220)" fill="#E9AAA5"/>
      <use href="#petal" transform="rotate(240)"/>
      <use href="#petal" transform="rotate(260)" fill="#E6A4A0"/>
      <use href="#petal" transform="rotate(280)" fill="#E9AAA5"/>
      <use href="#petal" transform="rotate(300)"/>
      <use href="#petal" transform="rotate(320)" fill="#E6A4A0"/>
      <use href="#petal" transform="rotate(340)" fill="#E9AAA5"/>

    </g>

    <!-- CAMADA INTERNA -->
    <g stroke="#E9B0AA" stroke-width="1.2">

      <use href="#petalInner" transform="rotate(10)" fill="#F3C6C1"/>
      <use href="#petalInner" transform="rotate(30)" fill="#F6D0CA"/>
      <use href="#petalInner" transform="rotate(50)" fill="#F0BDB8"/>
      <use href="#petalInner" transform="rotate(70)" fill="#F3C6C1"/>
      <use href="#petalInner" transform="rotate(90)" fill="#F6D0CA"/>
      <use href="#petalInner" transform="rotate(110)" fill="#F0BDB8"/>
      <use href="#petalInner" transform="rotate(130)" fill="#F3C6C1"/>
      <use href="#petalInner" transform="rotate(150)" fill="#F6D0CA"/>
      <use href="#petalInner" transform="rotate(170)" fill="#F0BDB8"/>
      <use href="#petalInner" transform="rotate(190)" fill="#F3C6C1"/>
      <use href="#petalInner" transform="rotate(210)" fill="#F6D0CA"/>
      <use href="#petalInner" transform="rotate(230)" fill="#F0BDB8"/>
      <use href="#petalInner" transform="rotate(250)" fill="#F3C6C1"/>
      <use href="#petalInner" transform="rotate(270)" fill="#F6D0CA"/>
      <use href="#petalInner" transform="rotate(290)" fill="#F0BDB8"/>
      <use href="#petalInner" transform="rotate(310)" fill="#F3C6C1"/>
      <use href="#petalInner" transform="rotate(330)" fill="#F6D0CA"/>
      <use href="#petalInner" transform="rotate(350)" fill="#F0BDB8"/>

    </g>

    <!-- CENTRO DA FLOR -->
    <circle r="68" fill="#A98A2E"
            opacity=".28" cx="5" cy="7"/>

    <circle r="62" fill="url(#gold)"/>

    <!-- REFLEXO DO CENTRO -->
    <path d="M 2,-39
             C 22,-38 39,-23 44,-3"
          fill="none"
          stroke="#FFFDF3"
          stroke-width="8"
          stroke-linecap="round"/>

  </g>
</svg>
