<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 640 500"
     width="640" height="500"
     role="img">

  <title>Bem Me Quero Perfumaria</title>

  <defs>
    <!-- Gradiente do centro dourado -->
    <radialGradient id="goldLogo" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#D9B84E"/>
      <stop offset="1" stop-color="#B98F32"/>
    </radialGradient>

    <!-- Formato das pétalas externas -->
    <path id="petalL"
      d="M 0,-42
         C -23,-76 -28,-133 -10,-178
         C -5,-191 5,-191 10,-178
         C 28,-133 23,-76 0,-42 Z"/>

    <!-- Formato das pétalas internas -->
    <path id="petalInnerL"
      d="M 0,-35
         C -20,-65 -25,-112 -9,-151
         C -4,-162 4,-162 9,-151
         C 25,-112 20,-65 0,-35 Z"/>
  </defs>

  <g transform="translate(320 118) scale(0.54)">
    <!-- CAMADA EXTERNA -->
    <g fill="#D9908F"
       stroke="#D48E8C"
       stroke-width="1.4">
      <use href="#petalL" transform="rotate(0)"/>
      <use href="#petalL" transform="rotate(20)" fill="#E6A4A0"/>
      <use href="#petalL" transform="rotate(40)" fill="#E9AAA5"/>
      <use href="#petalL" transform="rotate(60)"/>
      <use href="#petalL" transform="rotate(80)" fill="#E6A4A0"/>
      <use href="#petalL" transform="rotate(100)" fill="#E9AAA5"/>
      <use href="#petalL" transform="rotate(120)"/>
      <use href="#petalL" transform="rotate(140)" fill="#E6A4A0"/>
      <use href="#petalL" transform="rotate(160)" fill="#E9AAA5"/>
      <use href="#petalL" transform="rotate(180)"/>
      <use href="#petalL" transform="rotate(200)" fill="#E6A4A0"/>
      <use href="#petalL" transform="rotate(220)" fill="#E9AAA5"/>
      <use href="#petalL" transform="rotate(240)"/>
      <use href="#petalL" transform="rotate(260)" fill="#E6A4A0"/>
      <use href="#petalL" transform="rotate(280)" fill="#E9AAA5"/>
      <use href="#petalL" transform="rotate(300)"/>
      <use href="#petalL" transform="rotate(320)" fill="#E6A4A0"/>
      <use href="#petalL" transform="rotate(340)" fill="#E9AAA5"/>
    </g>

    <!-- CAMADA INTERNA -->
    <g stroke="#E9B0AA" stroke-width="1.2">
      <use href="#petalInnerL" transform="rotate(10)" fill="#F3C6C1"/>
      <use href="#petalInnerL" transform="rotate(30)" fill="#F6D0CA"/>
      <use href="#petalInnerL" transform="rotate(50)" fill="#F0BDB8"/>
      <use href="#petalInnerL" transform="rotate(70)" fill="#F3C6C1"/>
      <use href="#petalInnerL" transform="rotate(90)" fill="#F6D0CA"/>
      <use href="#petalInnerL" transform="rotate(110)" fill="#F0BDB8"/>
      <use href="#petalInnerL" transform="rotate(130)" fill="#F3C6C1"/>
      <use href="#petalInnerL" transform="rotate(150)" fill="#F6D0CA"/>
      <use href="#petalInnerL" transform="rotate(170)" fill="#F0BDB8"/>
      <use href="#petalInnerL" transform="rotate(190)" fill="#F3C6C1"/>
      <use href="#petalInnerL" transform="rotate(210)" fill="#F6D0CA"/>
      <use href="#petalInnerL" transform="rotate(230)" fill="#F0BDB8"/>
      <use href="#petalInnerL" transform="rotate(250)" fill="#F3C6C1"/>
      <use href="#petalInnerL" transform="rotate(270)" fill="#F6D0CA"/>
      <use href="#petalInnerL" transform="rotate(290)" fill="#F0BDB8"/>
      <use href="#petalInnerL" transform="rotate(310)" fill="#F3C6C1"/>
      <use href="#petalInnerL" transform="rotate(330)" fill="#F6D0CA"/>
      <use href="#petalInnerL" transform="rotate(350)" fill="#F0BDB8"/>
    </g>

    <!-- CENTRO DA FLOR -->
    <circle r="68" fill="#A98A2E" opacity=".28" cx="5" cy="7"/>
    <circle r="62" fill="url(#goldLogo)"/>

    <!-- REFLEXO DO CENTRO -->
    <path d="M 2,-39 C 22,-38 39,-23 44,-3"
          fill="none"
          stroke="#FFFDF3"
          stroke-width="8"
          stroke-linecap="round"/>
  </g>

  <text x="320" y="295" text-anchor="middle" font-family="'Playfair Display','Didot','Georgia',serif" font-weight="600" font-size="66" fill="#080706" letter-spacing="1.5">BEM ME QUERO</text>
  <text x="320" y="348" text-anchor="middle" font-family="'Playfair Display','Didot','Georgia',serif" font-weight="600" font-size="38" fill="#080706">Perfumaria</text>
  <text x="320" y="425" text-anchor="middle" font-family="'Nunito','Segoe UI',sans-serif" font-weight="800" font-size="25" fill="#080706">“Seu momento de amor-próprio”</text>
</svg>
